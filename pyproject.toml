[project]
name = "experiment-tracker-lite"
version = "2.0.0"
description = "Log experiments and runs with JSON params/metrics and compare runs side-by-side."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
